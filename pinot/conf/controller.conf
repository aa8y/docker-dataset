//
// Pinot controller, as this image runs it: single node, no redundancy.
//
// Cut down from the base image's own conf/pinot-controller.conf. The ports are
// left exactly where upstream puts them (9000) so the base image's EXPOSE and
// every piece of Pinot documentation still apply; what changes is the cluster
// name and the data directory.
//
// controller.data.dir is Pinot's *deep store* -- the durable copy of every
// segment, which the server downloads from after the controller builds it. The
// stock value is under /tmp; this image moves it to /var/lib/pinot so it is not
// competing with anything else in /tmp and, more importantly, so it stays out
// of /opt/pinot/data, which the base image declares as a VOLUME (writing there
// would spawn an anonymous Docker volume per container run and leak the
// dataset's segments outside the container's lifetime).
//

# Pinot Role
pinot.service.role=CONTROLLER

# Pinot Cluster name. One cluster per container; nothing else joins it.
pinot.cluster.name=pinot-dataset

# Pinot Zookeeper Server. Started by the entrypoint in its own small JVM before
# this process (Pinot has no in-process ZooKeeper outside the QuickStart path).
pinot.zk.server=localhost:2181

# Use hostname as Pinot Instance ID other than IP
pinot.set.instance.id.to.hostname=true

# Pinot Controller Port
controller.port=9000

# Pinot Controller VIP Host
controller.vip.host=localhost

# Pinot Controller VIP Port
controller.vip.port=9000

# Location to store Pinot Segments pushed from clients (the deep store)
controller.data.dir=/var/lib/pinot/controller
