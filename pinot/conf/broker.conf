//
// Pinot broker, as this image runs it. The broker is the query entry point:
// it is what `POST /query/sql` talks to, and what the query console in the
// controller UI proxies to.
//
// Cut down from the base image's own conf/pinot-broker.conf, keeping the
// upstream port (8099, one of the image's EXPOSEd ports) and changing only the
// cluster name. The stock file also sets a
// `pinot.broker.routing.table.builder.class` that no longer exists in 1.5.0
// and is ignored; it is dropped here rather than carried along.
//

# Pinot Role
pinot.service.role=BROKER

# Pinot Cluster name
pinot.cluster.name=pinot-dataset

# Pinot Zookeeper Server
pinot.zk.server=localhost:2181

# Use hostname as Pinot Instance ID other than IP
pinot.set.instance.id.to.hostname=true

# Pinot Broker Query Port
pinot.broker.client.queryPort=8099
