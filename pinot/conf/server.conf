//
// Pinot server, as this image runs it: the single node that holds every
// segment and answers the broker's scatter-gather.
//
// Cut down from the base image's own conf/pinot-server.conf, keeping the
// upstream ports (8098 query / 8097 admin, both EXPOSEd by the base image) and
// moving the two data directories off /tmp to /var/lib/pinot for the same
// reason as the controller's deep store -- and, again, deliberately not into
// /opt/pinot/data, which the base image declares as a VOLUME.
//
// Segments are memory-mapped rather than read onto the heap (Pinot's default
// loadMode for OFFLINE tables), which is what keeps the whole cluster inside a
// small -Xmx: the row data lives in the page cache, not in Java objects.
//

# Pinot Role
pinot.service.role=SERVER

# Pinot Cluster name
pinot.cluster.name=pinot-dataset

# Pinot Zookeeper Server
pinot.zk.server=localhost:2181

# Use hostname as Pinot Instance ID other than IP
pinot.set.instance.id.to.hostname=true

# Pinot Server Netty Port for queries
pinot.server.netty.port=8098

# Pinot Server Admin API port
pinot.server.adminapi.port=8097

# Pinot Server Data Directory (where downloaded segments are unpacked)
pinot.server.instance.dataDir=/var/lib/pinot/server/index

# Pinot Server Temporary Segment Tar Directory
pinot.server.instance.segmentTarDir=/var/lib/pinot/server/segmentTar
