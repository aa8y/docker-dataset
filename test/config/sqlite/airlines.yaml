schemaVersion: "2.0.0"

# Static assertions on the shipped database file. airlines is built at image
# build time into /data/airlines.db. (Row counts are asserted by the integration
# smoke test, since the database is a binary file the structure test cannot
# introspect.)

fileExistenceTests:
  - name: "airlines database file exists"
    path: "/data/airlines.db"
    shouldExist: true
