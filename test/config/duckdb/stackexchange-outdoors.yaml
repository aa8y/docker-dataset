schemaVersion: "2.0.0"

# Static assertions on the shipped database file. The StackExchange "outdoors"
# site dump is converted from XML at build time into /data/outdoors.duckdb.
# Counts drift (the archive.org dump is refreshed over time), so the integration
# smoke test records floors.

fileExistenceTests:
  - name: "outdoors database file exists"
    path: "/data/outdoors.duckdb"
    shouldExist: true
