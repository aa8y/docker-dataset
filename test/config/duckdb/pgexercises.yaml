schemaVersion: "2.0.0"

# Static assertions on the shipped database file. pgexercises is built at image build
# time from its PostgreSQL dump (rewritten for DuckDB by the shared
# scripts/pgsql transform hook) into /data/pgexercises.duckdb. Only file existence is
# asserted -- the base image is distroless (no shell), so there are no
# commandTests, and row counts are asserted by the integration smoke test,
# which the structure test cannot introspect a binary database file for.

fileExistenceTests:
  - name: "pgexercises database file exists"
    path: "/data/pgexercises.duckdb"
    shouldExist: true
