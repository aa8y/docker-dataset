schemaVersion: "2.0.0"

# Static assertions on the shipped database file. The StackExchange "boardgames"
# site dump is converted from XML at build time into /data/boardgames.duckdb.
# Counts drift (the archive.org dump is refreshed over time), so the integration
# smoke test records floors.

fileExistenceTests:
  - name: "boardgames database file exists"
    path: "/data/boardgames.duckdb"
    shouldExist: true
