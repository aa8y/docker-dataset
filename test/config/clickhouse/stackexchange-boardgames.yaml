schemaVersion: "2.0.0"

# The StackExchange "boardgames" site dump ships as per-table XML (no SQL); the boardgames
# transform hook converts each table to a MergeTree CREATE TABLE keyed on Id
# plus batched INSERTs. No indexes: ClickHouse's CREATE INDEX declares a
# data-skipping index rather than the ordinary lookup index the other engines
# emit, and the sorting key already does that job.
#
# The table assertions use `(?s)` so `.` spans newlines -- the
# `ENGINE = MergeTree ORDER BY ...` clause that gives a ClickHouse table its
# sorting key sits after the column list, below the table name.

fileExistenceTests:
  - name: "boardgames init script exists"
    path: "/docker-entrypoint-initdb.d/boardgames.sql"
    shouldExist: true

fileContentTests:
  - name: "boardgames selects its database"
    path: "/docker-entrypoint-initdb.d/boardgames.sql"
    expectedContents:
      - "USE `boardgames`;"

  - name: "boardgames declares all expected tables as MergeTree"
    path: "/docker-entrypoint-initdb.d/boardgames.sql"
    expectedContents:
      - "(?s)CREATE TABLE `Users` \\(.*?\\) ENGINE = MergeTree"
      - "(?s)CREATE TABLE `Posts` \\(.*?\\) ENGINE = MergeTree"
      - "(?s)CREATE TABLE `Comments` \\(.*?\\) ENGINE = MergeTree"
      - "(?s)CREATE TABLE `Votes` \\(.*?\\) ENGINE = MergeTree"
      - "(?s)CREATE TABLE `Badges` \\(.*?\\) ENGINE = MergeTree"
      - "(?s)CREATE TABLE `Tags` \\(.*?\\) ENGINE = MergeTree"
      - "(?s)CREATE TABLE `PostLinks` \\(.*?\\) ENGINE = MergeTree"
      - "(?s)CREATE TABLE `PostHistory` \\(.*?\\) ENGINE = MergeTree"

  - name: "boardgames loads data into every table"
    path: "/docker-entrypoint-initdb.d/boardgames.sql"
    expectedContents:
      - "INSERT INTO `Users` \\("
      - "INSERT INTO `Posts` \\("
      - "INSERT INTO `Comments` \\("
      - "INSERT INTO `Votes` \\("
      - "INSERT INTO `Badges` \\("
      - "INSERT INTO `Tags` \\("
      - "INSERT INTO `PostLinks` \\("
      - "INSERT INTO `PostHistory` \\("
