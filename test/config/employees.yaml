schemaVersion: "2.0.0"

# The employees sample is upstream's own PostgreSQL port: a schema file plus
# eight MySQL-flavoured data dumps that a shell script feeds to psql one at a
# time. The scripts/employees transform hook assembles them into one init
# script, so verify the wrapper SQL, the six tables, the two views, that the
# data really is inlined, and that upstream's DB-management header and the
# MySQL backtick quoting are both gone.

fileExistenceTests:
  - name: "employees init script exists"
    path: "/docker-entrypoint-initdb.d/employees.sql"
    shouldExist: true

fileContentTests:
  - name: "employees init script creates and connects to database"
    path: "/docker-entrypoint-initdb.d/employees.sql"
    expectedContents:
      - "CREATE DATABASE employees"
      - '\\c employees'
    excludedContents:
      - "DROP DATABASE IF EXISTS employees"
      - '\\connect employees'

  - name: "employees declares all expected tables"
    path: "/docker-entrypoint-initdb.d/employees.sql"
    expectedContents:
      - "CREATE TABLE employees[ (]"
      - "CREATE TABLE departments[ (]"
      - "CREATE TABLE dept_manager[ (]"
      - "CREATE TABLE dept_emp[ (]"
      - "CREATE TABLE titles[ (]"
      - "CREATE TABLE salaries[ (]"

  - name: "employees declares its views"
    path: "/docker-entrypoint-initdb.d/employees.sql"
    expectedContents:
      - "CREATE OR REPLACE VIEW dept_emp_latest_date"
      - "CREATE OR REPLACE VIEW current_dept_emp"

  - name: "employees inlines the data dumps upstream's loader feeds to psql"
    path: "/docker-entrypoint-initdb.d/employees.sql"
    expectedContents:
      - "INSERT INTO departments VALUES"
      - "INSERT INTO employees VALUES"
      - "INSERT INTO dept_emp VALUES"
      - "INSERT INTO dept_manager VALUES"
      - "INSERT INTO titles VALUES"
      - "INSERT INTO salaries VALUES"

  - name: "employees leaves no MySQL backtick quoting behind"
    path: "/docker-entrypoint-initdb.d/employees.sql"
    excludedContents:
      - "`"
