      # `latest` tracks a single representative dataset, mirroring postgres/mysql.
      latest:
        retagFrom: chinook
        structureTest: false
  # DuckDB images. Built on the official duckdb/duckdb image and published
  # under a separate repository. DuckDB is embedded like SQLite -- a database
  # is just a file -- so the build *builds the database file*: a dataset is
  # described either by a text SQL source (sqlFiles, fed to the duckdb CLI) or
  # by a prebuilt DuckDB database file (dbFile, shipped as-is). The official
  # image is distroless (no shell), so the Dockerfile adds a glibc loader
  # stage between the Alpine builder and the final image; see
  # duckdb/Dockerfile for the full shape. The build templates are the DuckDB
  # flavours (same arg surface as sqlite; test runs the DuckDB smoke-test
  # script) and override the global postgres ones for this context.
  duckdb:
    tagKeys: dataset
    parameters:
      repository: aa8y/duckdb-dataset
    structureTest:
      configs:
        - test/config/duckdb/common.yaml
    templates:
      # Mirrors the global templates (see top of file), including the always-on
      # registry build cache gated by the DATASET_CHECKSUM fingerprint. Emits
      # SQL_FILES or DB_FILE per tag (Mustache sections), never both.
      build: >
        {{^retagFrom}}docker buildx build --load ${PLATFORM:+--platform "$PLATFORM"}
        --cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-}
        ${CACHE_ARCH:+--cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}}
        ${CACHE_TO_SCOPE:+--cache-to type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-}-${CACHE_TO_SCOPE},mode=max,image-manifest=true}
        --build-arg DATASET={{dataset}}
        --build-arg DATASET_CHECKSUM="$(bin/dataset-checksum '{{{extractUrl}}}')"
        --build-arg 'EXTRACT_URL={{{extractUrl}}}'
        {{#sqlFiles}}--build-arg 'SQL_FILES={{{.}}}'{{/sqlFiles}}
        {{#dbFile}}--build-arg 'DB_FILE={{{.}}}'{{/dbFile}}
        {{#extraPrereqs}}--build-arg 'EXTRA_PREREQS={{{.}}}'{{/extraPrereqs}}
        -t {{{repository}}}:{{tag}} {{{context}}}{{/retagFrom}}
      test: '{{^retagFrom}}REPOSITORY={{{repository}}} bash test/integration/run-duckdb.sh {{tag}} {{dataset}}{{/retagFrom}}'
      push: >
        {{^retagFrom}}docker buildx build --push --platform "${PLATFORM:-{{{platforms}}}}"
        --cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-}
        ${CACHE_ARCH:+--cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}}
        --cache-to type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-},mode=max,image-manifest=true
        --build-arg DATASET={{dataset}}
        --build-arg DATASET_CHECKSUM="$(bin/dataset-checksum '{{{extractUrl}}}')"
        --build-arg 'EXTRACT_URL={{{extractUrl}}}'
        {{#sqlFiles}}--build-arg 'SQL_FILES={{{.}}}'{{/sqlFiles}}
        {{#dbFile}}--build-arg 'DB_FILE={{{.}}}'{{/dbFile}}
        {{#extraPrereqs}}--build-arg 'EXTRA_PREREQS={{{.}}}'{{/extraPrereqs}}
        -t {{{repository}}}:{{tag}}${TAG_SUFFIX:-} {{{context}}}{{/retagFrom}}
    tags:
      # Chinook digital-media store, from the same pinned vendor release the
      # sqlite chinook tag uses. The scripts/chinook transform hook (python3)
      # rewrites the script's two SQLite-isms -- bracket-quoted identifiers and
      # forward-referencing FOREIGN KEYs -- into DuckDB SQL; row counts match
      # the other chinook tags exactly.
      chinook:
        extractUrl: https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sql
        sqlFiles: Chinook_Sqlite.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/duckdb/chinook.yaml
      # PostgreSQL-dump datasets, the same sources the sqlite tags use. DuckDB's
      # parser is PostgreSQL-derived, so the shared scripts/pgsql transform hook
      # is a thin one next to SQLite's: it converts COPY blocks to INSERTs,
      # transcodes Latin-1 dumps, and removes only what DuckDB genuinely cannot
      # run (SET, setval, GRANT, USING btree, serial, FOREIGN KEYs, PL/pgSQL) --
      # PostgreSQL casts, column types and `ALTER TABLE ... ADD PRIMARY KEY` all
      # survive, so these tags keep their primary keys where the sqlite ones
      # cannot. Row counts match the sqlite tags exactly. Each dataset's
      # scripts/<dataset> dir is a symlink to scripts/pgsql.
      world:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/world/world-1.0/world-1.0.tar.gz
        sqlFiles: dbsamples-0.1/world/world.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/duckdb/world.yaml
      iso3166:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/iso-3166/iso-3166-1.0/iso-3166-1.0.tar.gz
        sqlFiles: iso-3166/iso-3166.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/duckdb/iso3166.yaml
      frenchtowns:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/french-towns-communes-francais/french-towns-communes-francaises-1.0/french-towns-communes-francaises-1.0.tar.gz
        sqlFiles: french-towns-communes-francaises.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/duckdb/frenchtowns.yaml
      usda:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/usda/usda-r18-1.0/usda-r18-1.0.tar.gz
        sqlFiles: usda-r18-1.0/usda.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/duckdb/usda.yaml
      pgexercises:
        extractUrl: >-
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/clubdata_ddl.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/clubdata_data.sql
        sqlFiles: clubdata_ddl.sql clubdata_data.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/duckdb/pgexercises.yaml
      dellstore:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/dellstore2/dellstore2-normal-1.0/dellstore2-normal-1.0.tar.gz
        sqlFiles: dellstore2-normal-1.0/dellstore2-normal-1.0.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/duckdb/dellstore.yaml
      # MoMA research collection. Published only as CSV, so the schema is
      # authored in-repo (duckdb/scripts/moma) and the CSVs are bulk-loaded at
      # build time by the `COPY ... FROM '<file>.csv'` statements the transform
      # hook appends -- DuckDB reads CSV in plain SQL, so unlike the sqlite tag
      # there are no dot-commands involved. Counts drift between builds (the
      # CSVs are refreshed upstream), so the smoke test records floors.
      moma:
        extractUrl: >-
          https://media.githubusercontent.com/media/MuseumofModernArt/collection/main/Artworks.csv
          https://media.githubusercontent.com/media/MuseumofModernArt/collection/main/Artists.csv
        sqlFiles: moma.sql
        structureTest:
          configs:
            - test/config/duckdb/moma.yaml
      # NYC TLC yellow-taxi trip records -- the DuckDB flagship, and the one
      # dataset here that ships as Parquet rather than SQL or CSV. Parquet is
      # compiled into the duckdb CLI, so the scripts/nyc-taxi transform hook
      # only has to author the one `CREATE TABLE trips AS FROM read_parquet(...)`
      # statement the generic LOAD step runs; the 73.5 MB file itself stays
      # behind in the loader stage (only /data is copied into the image).
      #
      # The month is pinned rather than tracking "latest available" so the tag
      # is reproducible: TLC publishes a new file every month and revises older
      # ones, and an unpinned URL would make the row count -- and so the smoke
      # test's expectation -- drift under CI. 2025-06 is ~4M rows.
      nyc-taxi:
        extractUrl: https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2025-06.parquet
        sqlFiles: nyc-taxi.sql
        structureTest:
          configs:
            - test/config/duckdb/nyc-taxi.yaml
      # StackExchange sites. Each ships as per-table XML in a 7z archive (no
      # SQL), so -- exactly like the other engines -- every site builds through
      # the shared scripts/stackexchange hooks (each site's scripts/<site> dir
      # is a symlink to it): the extract hook un-7z's the dump and the transform
      # hook converts the XML to a DuckDB init script (CREATE TABLE + batched
      # INSERTs + indexes). Adding a site is just a tag here + a structure-test
      # config + an expected/duckdb/<site>.json floor file.
      stackexchange-beer:
        dataset: beer
        extractUrl: https://archive.org/download/stackexchange/beer.stackexchange.com.7z
        sqlFiles: beer.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/duckdb/stackexchange-beer.yaml
      stackexchange-coffee:
        dataset: coffee
        extractUrl: https://archive.org/download/stackexchange/coffee.stackexchange.com.7z
        sqlFiles: coffee.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/duckdb/stackexchange-coffee.yaml
      stackexchange-poker:
        dataset: poker
        extractUrl: https://archive.org/download/stackexchange/poker.stackexchange.com.7z
        sqlFiles: poker.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/duckdb/stackexchange-poker.yaml
      stackexchange-woodworking:
        dataset: woodworking
        extractUrl: https://archive.org/download/stackexchange/woodworking.stackexchange.com.7z
        sqlFiles: woodworking.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/duckdb/stackexchange-woodworking.yaml
      stackexchange-chess:
        dataset: chess
        extractUrl: https://archive.org/download/stackexchange/chess.stackexchange.com.7z
        sqlFiles: chess.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/duckdb/stackexchange-chess.yaml
      stackexchange-cooking:
        dataset: cooking
        extractUrl: https://archive.org/download/stackexchange/cooking.stackexchange.com.7z
        sqlFiles: cooking.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/duckdb/stackexchange-cooking.yaml
      stackexchange-outdoors:
        dataset: outdoors
        extractUrl: https://archive.org/download/stackexchange/outdoors.stackexchange.com.7z
        sqlFiles: outdoors.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/duckdb/stackexchange-outdoors.yaml
      stackexchange-boardgames:
        dataset: boardgames
        extractUrl: https://archive.org/download/stackexchange/boardgames.stackexchange.com.7z
        sqlFiles: boardgames.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/duckdb/stackexchange-boardgames.yaml
      # `latest` tracks a single representative dataset, mirroring the other
      # engines.
      latest:
        retagFrom: chinook
        structureTest: false
