  # CockroachDB images. Built on the official cockroachdb/cockroach image and
  # published under a separate repository. There is no official Alpine image,
  # but the official one is slim (UBI-minimal, ~170 MB) and multi-arch, and its
  # entrypoint honours the same /docker-entrypoint-initdb.d/*.sql convention the
  # official postgres image uses (when started with `start-single-node`). Since
  # CockroachDB is PostgreSQL wire- and SQL-compatible, these reuse the same
  # PostgreSQL-dialect sample dumps the Yugabyte postgres tags do. The build
  # templates are the CockroachDB flavours (fewer build args than postgres; test
  # runs the CockroachDB smoke-test script) and override the global postgres
  # ones for this context.
  cockroach:
    tagKeys: dataset
    parameters:
      repository: aa8y/cockroach-dataset
    structureTest:
      configs:
        - test/config/cockroach/common.yaml
    templates:
      # Mirrors the global templates (see top of file), including the always-on
      # registry build cache gated by the DATASET_CHECKSUM fingerprint.
      build: >
        {{^retagFrom}}docker buildx build --load ${PLATFORM:+--platform "$PLATFORM"}
        --cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-}
        ${CACHE_ARCH:+--cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}}
        ${CACHE_TO_SCOPE:+--cache-to type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-}-${CACHE_TO_SCOPE},mode=max,image-manifest=true}
        --build-arg DATASET={{dataset}}
        --build-arg DATASET_CHECKSUM="$(bin/dataset-checksum '{{{extractUrl}}}')"
        --build-arg 'EXTRACT_URL={{{extractUrl}}}'
        --build-arg 'SQL_FILES={{{sqlFiles}}}'
        {{#extraPrereqs}}--build-arg 'EXTRA_PREREQS={{{.}}}'{{/extraPrereqs}}
        {{#cdDir}}--build-arg 'CD_DIR={{{.}}}'{{/cdDir}}
        {{#indexMethod}}--build-arg INDEX_METHOD={{.}}{{/indexMethod}}
        -t {{{repository}}}:{{tag}} {{{context}}}{{/retagFrom}}
      test: '{{^retagFrom}}REPOSITORY={{{repository}}} bash test/integration/run-cockroach.sh {{tag}} {{dataset}}{{/retagFrom}}'
      push: >
        {{^retagFrom}}docker buildx build --push --platform "${PLATFORM:-{{{platforms}}}}"
        --cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-}
        ${CACHE_ARCH:+--cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}}
        --cache-to type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-},mode=max,image-manifest=true
        --build-arg DATASET={{dataset}}
        --build-arg DATASET_CHECKSUM="$(bin/dataset-checksum '{{{extractUrl}}}')"
        --build-arg 'EXTRACT_URL={{{extractUrl}}}'
        --build-arg 'SQL_FILES={{{sqlFiles}}}'
        {{#extraPrereqs}}--build-arg 'EXTRA_PREREQS={{{.}}}'{{/extraPrereqs}}
        {{#cdDir}}--build-arg 'CD_DIR={{{.}}}'{{/cdDir}}
        {{#indexMethod}}--build-arg INDEX_METHOD={{.}}{{/indexMethod}}
        -t {{{repository}}}:{{tag}}${TAG_SUFFIX:-} {{{context}}}{{/retagFrom}}
    tags:
      # Chinook digital-media store, sourced from Yugabyte's PostgreSQL-dialect
      # mirror (the same dump behind the postgres `yugabyte-chinook` tag): plain
      # DDL + INSERT data with quoted CamelCase identifiers, which load on
      # CockroachDB unchanged.
      chinook:
        extractUrl: >-
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/chinook_ddl.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/chinook_genres_artists_albums.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/chinook_songs.sql
        sqlFiles: chinook_ddl.sql chinook_genres_artists_albums.sql chinook_songs.sql
        # python3 for the scripts/chinook -> yugabyte transform (coalesces the
        # dump's single-row INSERTs into batched multi-row INSERTs).
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/cockroach/chinook.yaml
      # Northwind specialty-foods sample, same Yugabyte PostgreSQL-dialect dump
      # behind the postgres `yugabyte-northwind` tag (DDL + INSERT data).
      northwind:
        extractUrl: >-
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/northwind_ddl.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/northwind_data.sql
        sqlFiles: northwind_ddl.sql northwind_data.sql
        structureTest:
          configs:
            - test/config/cockroach/northwind.yaml
      # Plain PostgreSQL-dialect dumps from pgFoundry or Yugabyte that load on
      # CockroachDB unchanged (mirroring the postgres tags for these datasets).
      world:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/world/world-1.0/world-1.0.tar.gz
        sqlFiles: dbsamples-0.1/world/world.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/cockroach/world.yaml
      iso3166:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/iso-3166/iso-3166-1.0/iso-3166-1.0.tar.gz
        sqlFiles: iso-3166/iso-3166.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/cockroach/iso3166.yaml
      frenchtowns:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/french-towns-communes-francais/french-towns-communes-francaises-1.0/french-towns-communes-francaises-1.0.tar.gz
        sqlFiles: french-towns-communes-francaises.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/cockroach/frenchtowns.yaml
      usda:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/usda/usda-r18-1.0/usda-r18-1.0.tar.gz
        sqlFiles: usda-r18-1.0/usda.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/cockroach/usda.yaml
      pgexercises:
        extractUrl: >-
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/clubdata_ddl.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/clubdata_data.sql
        sqlFiles: clubdata_ddl.sql clubdata_data.sql
        structureTest:
          configs:
            - test/config/cockroach/pgexercises.yaml
      dellstore:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/dellstore2/dellstore2-normal-1.0/dellstore2-normal-1.0.tar.gz
        sqlFiles: dellstore2-normal-1.0/dellstore2-normal-1.0.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/cockroach/dellstore.yaml
      sportsdb:
        extractUrl: >-
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/sportsdb_tables.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/sportsdb_inserts.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/sportsdb_indexes.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/sportsdb_constraints.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/sportsdb_fks.sql
        sqlFiles: sportsdb_tables.sql sportsdb_inserts.sql sportsdb_indexes.sql sportsdb_constraints.sql sportsdb_fks.sql
        extraPrereqs: python3
        indexMethod: btree
        structureTest:
          configs:
            - test/config/cockroach/sportsdb.yaml
      # MoMA publishes only CSV, so the schema is authored in-repo
      # (cockroach/scripts/moma) and the transform hook bakes the CSV data into
      # the init script as INSERTs (CockroachDB's SQL client supports neither
      # \copy nor COPY FROM '<file>'), so nothing ships beside the init script.
      moma:
        extractUrl: >-
          https://media.githubusercontent.com/media/MuseumofModernArt/collection/main/Artworks.csv
          https://media.githubusercontent.com/media/MuseumofModernArt/collection/main/Artists.csv
        sqlFiles: moma.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/cockroach/moma.yaml
      # GeoNames cities15000. Published only as a zipped tab-separated export, so
      # the schema is authored in-repo (cockroach/scripts/geonames) and the
      # export is bulk-loaded with IMPORT INTO over its DELIMITED (TSV) format.
      # Upstream refreshes the dump daily, so the smoke test records floors.
      geonames:
        extractUrl: https://download.geonames.org/export/dump/cities15000.zip
        sqlFiles: geonames.sql
        structureTest:
          configs:
            - test/config/cockroach/geonames.yaml
      # OpenFlights airports/airlines/routes. Published only as three
      # comma-separated data files, so the schema is authored in-repo
      # (cockroach/scripts/openflights) and the files are bulk-loaded with
      # IMPORT INTO straight from the node's external-IO dir (they are already
      # RFC4180 CSV, so unlike moma they need no normalizing). Upstream
      # refreshes them in place, so the smoke test records floors.
      openflights:
        extractUrl: >-
          https://raw.githubusercontent.com/jpatokal/openflights/master/data/airports.dat
          https://raw.githubusercontent.com/jpatokal/openflights/master/data/airlines.dat
          https://raw.githubusercontent.com/jpatokal/openflights/master/data/routes.dat
        sqlFiles: openflights.sql
        structureTest:
          configs:
            - test/config/cockroach/openflights.yaml
      # StackExchange sites all share one schema, so they all build through the
      # shared scripts/stackexchange hooks (each site's scripts/<site> dir is a
      # symlink to it). Adding a site is just a tag here + a structure-test
      # config + an expected/cockroach/<site>.json floor file.
      stackexchange-beer:
        dataset: beer
        extractUrl: https://archive.org/download/stackexchange/beer.stackexchange.com.7z
        sqlFiles: beer.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/cockroach/stackexchange-beer.yaml
      stackexchange-coffee:
        dataset: coffee
        extractUrl: https://archive.org/download/stackexchange/coffee.stackexchange.com.7z
        sqlFiles: coffee.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/cockroach/stackexchange-coffee.yaml
      stackexchange-poker:
        dataset: poker
        extractUrl: https://archive.org/download/stackexchange/poker.stackexchange.com.7z
        sqlFiles: poker.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/cockroach/stackexchange-poker.yaml
      stackexchange-woodworking:
        dataset: woodworking
        extractUrl: https://archive.org/download/stackexchange/woodworking.stackexchange.com.7z
        sqlFiles: woodworking.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/cockroach/stackexchange-woodworking.yaml
      stackexchange-chess:
        dataset: chess
        extractUrl: https://archive.org/download/stackexchange/chess.stackexchange.com.7z
        sqlFiles: chess.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/cockroach/stackexchange-chess.yaml
      stackexchange-cooking:
        dataset: cooking
        extractUrl: https://archive.org/download/stackexchange/cooking.stackexchange.com.7z
        sqlFiles: cooking.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/cockroach/stackexchange-cooking.yaml
      stackexchange-outdoors:
        dataset: outdoors
        extractUrl: https://archive.org/download/stackexchange/outdoors.stackexchange.com.7z
        sqlFiles: outdoors.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/cockroach/stackexchange-outdoors.yaml
      stackexchange-boardgames:
        dataset: boardgames
        extractUrl: https://archive.org/download/stackexchange/boardgames.stackexchange.com.7z
        sqlFiles: boardgames.sql
        extraPrereqs: p7zip python3 py3-lxml
        structureTest:
          configs:
            - test/config/cockroach/stackexchange-boardgames.yaml
      # `latest` tracks a single representative dataset, mirroring postgres/mysql.
      latest:
        retagFrom: chinook
        structureTest: false
  # SQLite images. Built on the Alpine, statically-linked keinos/sqlite3 image
  # and published under a separate repository. SQLite is serverless -- a
  # database is just a file -- so the build *builds the database file* rather
  # than shipping init scripts: a dataset is described either by a text SQL
  # source (sqlFiles, fed to the sqlite3 CLI to build the database) or by a
  # prebuilt SQLite database file (dbFile, shipped as-is). The build templates
  # are the SQLite flavours (no init-script assembly; test runs the SQLite
  # smoke-test script) and override the global postgres ones for this context.
  sqlite:
    tagKeys: dataset
    parameters:
      repository: aa8y/sqlite-dataset
    structureTest:
      configs:
        - test/config/sqlite/common.yaml
    templates:
      # Mirrors the global templates (see top of file), including the always-on
      # registry build cache gated by the DATASET_CHECKSUM fingerprint. Emits
      # SQL_FILES or DB_FILE per tag (Mustache sections), never both.
      build: >
        {{^retagFrom}}docker buildx build --load ${PLATFORM:+--platform "$PLATFORM"}
        --cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-}
        ${CACHE_ARCH:+--cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}}
        ${CACHE_TO_SCOPE:+--cache-to type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-}-${CACHE_TO_SCOPE},mode=max,image-manifest=true}
        --build-arg DATASET={{dataset}}
        --build-arg DATASET_CHECKSUM="$(bin/dataset-checksum '{{{extractUrl}}}')"
        --build-arg 'EXTRACT_URL={{{extractUrl}}}'
        {{#sqlFiles}}--build-arg 'SQL_FILES={{{.}}}'{{/sqlFiles}}
        {{#dbFile}}--build-arg 'DB_FILE={{{.}}}'{{/dbFile}}
        {{#extraPrereqs}}--build-arg 'EXTRA_PREREQS={{{.}}}'{{/extraPrereqs}}
        -t {{{repository}}}:{{tag}} {{{context}}}{{/retagFrom}}
      test: '{{^retagFrom}}REPOSITORY={{{repository}}} bash test/integration/run-sqlite.sh {{tag}} {{dataset}}{{/retagFrom}}'
      push: >
        {{^retagFrom}}docker buildx build --push --platform "${PLATFORM:-{{{platforms}}}}"
        --cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-}
        ${CACHE_ARCH:+--cache-from type=registry,ref={{{repository}}}:buildcache-{{tag}}}
        --cache-to type=registry,ref={{{repository}}}:buildcache-{{tag}}${CACHE_ARCH:-},mode=max,image-manifest=true
        --build-arg DATASET={{dataset}}
        --build-arg DATASET_CHECKSUM="$(bin/dataset-checksum '{{{extractUrl}}}')"
        --build-arg 'EXTRACT_URL={{{extractUrl}}}'
        {{#sqlFiles}}--build-arg 'SQL_FILES={{{.}}}'{{/sqlFiles}}
        {{#dbFile}}--build-arg 'DB_FILE={{{.}}}'{{/dbFile}}
        {{#extraPrereqs}}--build-arg 'EXTRA_PREREQS={{{.}}}'{{/extraPrereqs}}
        -t {{{repository}}}:{{tag}}${TAG_SUFFIX:-} {{{context}}}{{/retagFrom}}
    tags:
      # Chinook digital-media store. The vendor ships a native SQLite SQL script
      # (release v1.4.5), which the build runs through the sqlite3 CLI to create
      # /data/chinook.db. Same CamelCase identifiers as the other chinook tags.
      chinook:
        extractUrl: https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sql
        sqlFiles: Chinook_Sqlite.sql
        structureTest:
          configs:
            - test/config/sqlite/chinook.yaml
      # Northwind specialty-foods sample. The jpwhite3/northwind-SQLite3 port
      # publishes a prebuilt database (dist/northwind.db), shipped as-is. This is
      # the expanded edition of the sample (a large Order Details table).
      northwind:
        extractUrl: https://raw.githubusercontent.com/jpwhite3/northwind-SQLite3/main/dist/northwind.db
        dbFile: northwind.db
        structureTest:
          configs:
            - test/config/sqlite/northwind.yaml
      # Tier 1 hand-translated PostgreSQL datasets. These ship only as
      # PostgreSQL dumps, but are plain DDL + data (no PL/pgSQL, no extensions),
      # so the shared scripts/pgsql transform hook rewrites the dialect at build
      # time (COPY -> INSERT, strip Postgres-only noise). SQLite cannot add
      # constraints via ALTER TABLE, so PK/FK/unique from the dump are dropped;
      # tables and row counts still load faithfully. Each dataset's
      # scripts/<dataset> dir is a symlink to scripts/pgsql.
      world:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/world/world-1.0/world-1.0.tar.gz
        sqlFiles: dbsamples-0.1/world/world.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/sqlite/world.yaml
      iso3166:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/iso-3166/iso-3166-1.0/iso-3166-1.0.tar.gz
        sqlFiles: iso-3166/iso-3166.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/sqlite/iso3166.yaml
      frenchtowns:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/french-towns-communes-francais/french-towns-communes-francaises-1.0/french-towns-communes-francaises-1.0.tar.gz
        sqlFiles: french-towns-communes-francaises.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/sqlite/frenchtowns.yaml
      usda:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/usda/usda-r18-1.0/usda-r18-1.0.tar.gz
        sqlFiles: usda-r18-1.0/usda.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/sqlite/usda.yaml
      pgexercises:
        extractUrl: >-
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/clubdata_ddl.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/clubdata_data.sql
        sqlFiles: clubdata_ddl.sql clubdata_data.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/sqlite/pgexercises.yaml
      # Tier 2 hand-translated PostgreSQL datasets. Larger / slightly more
      # involved than tier 1 but still handled by the shared scripts/pgsql hook:
      # sportsdb is INSERT-based across five files with sequences and constraints;
      # dellstore2 is COPY-based plus a PL/pgSQL stored function, which the hook
      # drops (no mechanical SQLite translation -- the schema and all data still
      # load faithfully).
      dellstore:
        extractUrl: https://ftp.postgresql.org/pub/projects/pgFoundry/dbsamples/dellstore2/dellstore2-normal-1.0/dellstore2-normal-1.0.tar.gz
        sqlFiles: dellstore2-normal-1.0/dellstore2-normal-1.0.sql
        extraPrereqs: python3
        structureTest:
          configs:
            - test/config/sqlite/dellstore.yaml
      sportsdb:
        extractUrl: >-
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/sportsdb_tables.sql
          https://raw.githubusercontent.com/yugabyte/yugabyte-db/master/sample/sportsdb_inserts.sql
